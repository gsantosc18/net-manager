services:
  net-monitor:
    build:
      context: ./monitor
    container_name: net-monitor
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - ./monitor:/app
    cap_add:
      - NET_RAW
    environment:
      - METRICS_PORT=8000
      - WAN1_NAME=${WAN1_NAME:-Operadora 1}
      - WAN1_TARGET=${WAN1_TARGET:-9.9.9.9}
      - WAN2_NAME=${WAN2_NAME:-Operadora 2}
      - WAN2_TARGET=${WAN2_TARGET:-149.112.112.112}
      - PING_INTERVAL=${PING_INTERVAL:-10}
      - PING_COUNT=${PING_COUNT:-5}
      - SPEEDTEST_INTERVAL=${SPEEDTEST_INTERVAL:-1800}
      - FLAPPING_MIN_SCORE_DIFF=5.0
      - FLAPPING_CONFIRM_CYCLES=3
      - ER605_HOST=${ER605_HOST:-192.168.10.1}
      - ER605_USER=${ER605_USER:-myhouse}
      - ER605_PASS=${ER605_PASS:-24865310@Asd}
      - FAILOVER_ENABLED=${FAILOVER_ENABLED:-true}
      - FAILOVER_INTERVAL=${FAILOVER_INTERVAL:-3600}
      - EMERGENCY_FAILOVER=${EMERGENCY_FAILOVER:-true}
    networks:
      - net-monitor-network

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - net-monitor-network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/tmp/dashboards/isp_monitor.json
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - WAN1_NAME=${WAN1_NAME:-Operadora 1}
      - WAN2_NAME=${WAN2_NAME:-Operadora 2}
    entrypoint:
      - "sh"
      - "-c"
      - "mkdir -p /tmp/dashboards && sed -e \"s/__WAN1_NAME__/$${WAN1_NAME:-Operadora 1}/g\" -e \"s/__WAN2_NAME__/$${WAN2_NAME:-Operadora 2}/g\" /etc/grafana/dashboards-template/isp_monitor.json > /tmp/dashboards/isp_monitor.json && exec /run.sh"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards-template:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - net-monitor-network

networks:
  net-monitor-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
